<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07010f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Forever Tonight — Jacob & Claudia">
<meta property="og:description" content="A trance anthem built from pure code. 🎯 Dabble Sounds drop #001.">
<title>Forever Tonight — Jacob &amp; Claudia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#07010f; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  #viz { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:space-between; align-items:center; padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 22px); pointer-events:none; }
  header { text-align:center; }
  .kicker { font-size:11px; letter-spacing:4px; color:#a78bfa; text-transform:uppercase; margin-bottom:10px; opacity:.9; }
  h1 { font-size:clamp(30px,8.5vw,52px); font-weight:800; letter-spacing:2px; background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6,#22d3ee); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 8s linear infinite; }
  @keyframes shine { to { background-position:300% 0; } }
  .artists { margin-top:8px; font-size:14px; letter-spacing:3px; color:#e9d5ff; opacity:.85; text-transform:uppercase; }
  .tag { margin-top:6px; font-size:12px; color:#8b7ab8; font-style:italic; }
  .center { position:relative; width:120px; height:120px; pointer-events:auto; }
  #playBtn { position:absolute; inset:0; border-radius:50%; border:none; cursor:pointer; background:rgba(20,8,40,.55); backdrop-filter:blur(6px); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 0 40px rgba(167,139,250,.45), inset 0 0 24px rgba(167,139,250,.25); transition:transform .15s ease; }
  #playBtn:active { transform:scale(.93); }
  #playBtn svg { width:44px; height:44px; fill:#fff; filter:drop-shadow(0 0 8px rgba(255,255,255,.7)); }
  #ring { position:absolute; inset:-6px; width:132px; height:132px; transform:rotate(-90deg); pointer-events:none; }
  #ring circle { fill:none; stroke-width:3; }
  #ringBg { stroke:rgba(255,255,255,.12); }
  #ringFg { stroke:url(#grad); stroke-linecap:round; }
  footer { text-align:center; }
  #time { font-size:12px; color:#b9a8e0; letter-spacing:2px; margin-bottom:10px; font-variant-numeric:tabular-nums; }
  .credit { font-size:12px; color:#7c6aa8; letter-spacing:1px; }
  .credit b { color:#a78bfa; }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div class="ui">
  <header>
    <div class="kicker">Dabble Sounds · Drop 001</div>
    <h1>FOREVER TONIGHT</h1>
    <div class="artists">Jacob &amp; Claudia</div>
    <div class="tag">for everyone who knows tomorrow is too late</div>
  </header>
  <div class="center">
    <svg id="ring" viewBox="0 0 132 132">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
        </linearGradient>
      </defs>
      <circle id="ringBg" cx="66" cy="66" r="62"/>
      <circle id="ringFg" cx="66" cy="66" r="62" stroke-dasharray="389.6" stroke-dashoffset="389.6"/>
    </svg>
    <button id="playBtn" aria-label="Play">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
  </div>
  <footer>
    <div id="time">0:00 / 2:49</div>
    <div class="credit">🎯 <b>Dabble</b> — games, tools &amp; other good ideas · built with 🖤 by Jacob &amp; Claudia</div>
  </footer>
</div>
<audio id="track" src="forever-tonight.mp3" preload="auto" playsinline></audio>
<script>
(function(){
  var canvas = document.getElementById('viz'), ctx = canvas.getContext('2d');
  var audio = document.getElementById('track');
  var btn = document.getElementById('playBtn'), iPlay = document.getElementById('iconPlay'), iPause = document.getElementById('iconPause');
  var ringFg = document.getElementById('ringFg'), timeEl = document.getElementById('time');
  var actx = null, analyser = null, freq = null, playing = false, t0 = 0;
  var CIRC = 2 * Math.PI * 62;

  function resize(){ canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', resize); resize();

  function ensureCtx(){
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    var src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.82;
    src.connect(analyser); analyser.connect(actx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
  }

  function fmt(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

  btn.addEventListener('click', function(){
    ensureCtx();
    if (audio.paused) { audio.play(); } else { audio.pause(); }
  });
  audio.addEventListener('play', function(){ playing = true; iPlay.style.display='none'; iPause.style.display='block'; });
  audio.addEventListener('pause', function(){ playing = false; iPlay.style.display='block'; iPause.style.display='none'; });
  audio.addEventListener('ended', function(){ playing = false; iPlay.style.display='block'; iPause.style.display='none'; });

  var idlePhase = 0;
  function draw(){
    requestAnimationFrame(draw);
    var W = canvas.width, H = canvas.height, cx = W/2, cy = H/2;
    ctx.fillStyle = 'rgba(7,1,15,0.32)';
    ctx.fillRect(0,0,W,H);

    var bass = 0, data = null;
    if (analyser && playing) {
      analyser.getByteFrequencyData(freq);
      data = freq;
      var bsum = 0; for (var b = 1; b < 8; b++) bsum += freq[b];
      bass = bsum / 7 / 255;
    } else {
      idlePhase += 0.02;
      bass = 0.12 + 0.06 * Math.sin(idlePhase);
    }

    var baseR = Math.min(W,H) * 0.16 * (1 + bass * 0.18);

    // glow core
    var g = ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*2.6);
    g.addColorStop(0,'rgba(167,139,250,'+(0.30+bass*0.35)+')');
    g.addColorStop(0.5,'rgba(34,211,238,'+(0.10+bass*0.18)+')');
    g.addColorStop(1,'rgba(7,1,15,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // radial spectrum
    var bars = 120;
    for (var i = 0; i < bars; i++) {
      var a = (i / bars) * Math.PI * 2 - Math.PI/2;
      var v;
      if (data) {
        var idx = 2 + Math.floor(Math.pow(i/bars, 1.6) * (data.length * 0.72));
        v = data[idx] / 255;
      } else {
        v = 0.10 + 0.05 * Math.sin(idlePhase * 1.7 + i * 0.35);
      }
      var len = v * Math.min(W,H) * 0.30 + 2;
      var x1 = cx + Math.cos(a) * baseR, y1 = cy + Math.sin(a) * baseR;
      var x2 = cx + Math.cos(a) * (baseR + len), y2 = cy + Math.sin(a) * (baseR + len);
      var hue = 190 + (i/bars) * 130;
      ctx.strokeStyle = 'hsla(' + hue + ',90%,' + (55 + v*20) + '%,' + (0.35 + v*0.65) + ')';
      ctx.lineWidth = Math.max(2, Math.min(W,H) * 0.006);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }

    // progress ring + time
    if (audio.duration) {
      var p = audio.currentTime / audio.duration;
      ringFg.style.strokeDashoffset = String(CIRC * (1 - p));
      timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
    }
  }
  draw();
})();
</script>
</body>
</html>
