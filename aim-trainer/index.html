<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aim Trainer — Dabble</title>
<meta name="description" content="Tap 30 targets as fast as you can. Free aim trainer — how quick are your reflexes, really?">
<style>
  :root{ --bg:#0b0e1a; --card:#131830; --ink:#e8ecff; --dim:#8b93b8; --acc1:#7c6cff; --acc2:#b48cff; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; }
  h1{ font-size:1.6rem; font-weight:800; margin:8px 0 2px; }
  .sub{ color:var(--dim); font-size:.9rem; margin-bottom:14px; text-align:center; }
  .stats{ display:flex; gap:12px; margin-bottom:16px; }
  .stat{ background:var(--card); border:1px solid #232a4d; border-radius:14px; padding:10px 18px; text-align:center; min-width:96px; }
  .stat .num{ font-size:1.35rem; font-weight:800; background:linear-gradient(135deg,var(--acc1),var(--acc2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .stat .lbl{ font-size:.7rem; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
  #arena{ position:relative; width:100%; max-width:520px; height:56vh; min-height:340px; background:var(--card); border:1px solid #232a4d; border-radius:20px; overflow:hidden; touch-action:manipulation; user-select:none; }
  #arena.start{ display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #arena.start .go{ font-size:1.25rem; font-weight:700; text-align:center; line-height:1.7; padding:20px; }
  #arena.start .go small{ display:block; color:var(--dim); font-size:.85rem; font-weight:400; margin-top:10px; }
  #target{ position:absolute; border-radius:50%; background:radial-gradient(circle at 35% 35%, #c9b8ff, var(--acc1) 60%, #5a48d8); box-shadow:0 0 22px rgba(124,108,255,.55); cursor:pointer; transition:transform .06s; }
  #target:active{ transform:scale(.9); }
  #done{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(11,14,26,.94); text-align:center; padding:20px; }
  #done .big{ font-size:2.6rem; font-weight:800; background:linear-gradient(135deg,var(--acc1),var(--acc2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  #done .row{ display:flex; gap:10px; margin-top:8px; }
  button.act{ padding:13px 26px; border-radius:999px; border:0; font-size:1rem; font-weight:700; cursor:pointer; }
  button.act.primary{ background:linear-gradient(135deg,var(--acc1),var(--acc2)); color:#fff; }
  button.act.ghost{ background:transparent; color:var(--ink); border:1px solid #2c3560; }
  .credit{ margin-top:26px; color:var(--dim); font-size:.78rem; text-align:center; line-height:1.7; }
  .credit a{ color:var(--acc2); text-decoration:none; }
</style>
</head>
<body>
  <h1>🎯 Aim Trainer</h1>
  <p class="sub">Tap the orb 30 times. It moves. The clock doesn't care.</p>
  <div class="stats">
    <div class="stat"><div class="num" id="sTime">—</div><div class="lbl">time</div></div>
    <div class="stat"><div class="num" id="sHits">0 / 30</div><div class="lbl">targets</div></div>
    <div class="stat"><div class="num" id="sBest">—</div><div class="lbl">best</div></div>
  </div>
  <div id="arena" class="start">
    <div class="go" id="goMsg">Tap to start<small>30 targets, one clock, zero mercy</small></div>
    <div id="target" hidden></div>
    <div id="done">
      <div class="big" id="dTime">0.0s</div>
      <div id="dVerdict" style="color:var(--dim)"></div>
      <div class="row">
        <button class="act primary" id="again">Again</button>
        <button class="act ghost" id="share">Challenge a friend</button>
      </div>
    </div>
  </div>
  <p class="credit">🎯 <b>Dabble</b> — games, tools &amp; other good ideas · built with 🖤 by Jacob &amp; Claudia<br>
  more: <a href="../reaction-time/">Reaction Time</a> · <a href="../typing-speed-test/">Typing Speed</a></p>
<script>
(function(){
  const arena = document.getElementById('arena'), t = document.getElementById('target'),
        done = document.getElementById('done'), goMsg = document.getElementById('goMsg'),
        sTime = document.getElementById('sTime'), sHits = document.getElementById('sHits'), sBest = document.getElementById('sBest'),
        dTime = document.getElementById('dTime'), dVerdict = document.getElementById('dVerdict');
  const TOTAL = 30, KEY = 'dabble_aim_best';
  let hits = 0, startT = 0, playing = false;
  const best = parseFloat(localStorage.getItem(KEY) || 'NaN');
  if (!isNaN(best)) sBest.textContent = best.toFixed(1) + 's';

  function place(){
    const r = arena.getBoundingClientRect();
    const size = Math.max(44, Math.min(72, r.width * 0.14));
    const pad = 8;
    const x = pad + Math.random() * (r.width - size - pad * 2);
    const y = pad + Math.random() * (r.height - size - pad * 2);
    t.style.width = t.style.height = size + 'px';
    t.style.left = x + 'px'; t.style.top = y + 'px';
  }
  function begin(){
    hits = 0; playing = true;
    arena.classList.remove('start'); goMsg.style.display = 'none';
    done.style.display = 'none'; t.hidden = false;
    sHits.textContent = '0 / ' + TOTAL; sTime.textContent = '0.0s';
    startT = performance.now(); place();
  }
  arena.addEventListener('click', () => { if (!playing && done.style.display !== 'flex') begin(); });
  document.getElementById('again').addEventListener('click', e => { e.stopPropagation(); begin(); });
  t.addEventListener('pointerdown', e => {
    if (!playing) return;
    e.stopPropagation(); e.preventDefault();
    hits++; sHits.textContent = hits + ' / ' + TOTAL;
    if (hits >= TOTAL){ finish(); } else { place(); }
  });
  function finish(){
    playing = false; t.hidden = true;
    const secs = (performance.now() - startT) / 1000;
    sTime.textContent = secs.toFixed(1) + 's'; dTime.textContent = secs.toFixed(1) + 's';
    const prev = parseFloat(localStorage.getItem(KEY) || 'NaN');
    let verdict;
    if (isNaN(prev) || secs < prev){ localStorage.setItem(KEY, String(secs)); sBest.textContent = secs.toFixed(1) + 's'; verdict = '🏆 new best!'; }
    else verdict = 'best: ' + prev.toFixed(1) + 's';
    if (secs < 15) verdict += ' · absolutely cracked ⚡';
    else if (secs < 25) verdict += ' · quick hands 🔥';
    else if (secs < 40) verdict += ' · solid 🎯';
    else verdict += ' · the turtle sends regards 🐢';
    dVerdict.textContent = verdict;
    done.style.display = 'flex';
  }
  document.getElementById('share').addEventListener('click', async e => {
    e.stopPropagation();
    const txt = 'I cleared 30 targets in ' + dTime.textContent + ' on the Dabble Aim Trainer — beat that: ' + location.href;
    try{
      if (navigator.share){ await navigator.share({ text: txt }); }
      else { await navigator.clipboard.writeText(txt); e.target.textContent = 'Copied!'; setTimeout(()=> e.target.textContent='Challenge a friend', 1600); }
    }catch(err){}
  });
})();
</script>
</body>
</html>
